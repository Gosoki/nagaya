<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：全屏 PWA 下内容能铺到刘海屏边缘，再靠 safe-area 内缩。

         user-scalable=no / maximum-scale=1：关掉缩放。**只在加到主屏的那个 app 里生效** ——
         iOS 10 起 Safari 的标签页里一律无视这两条（Apple 不许网页禁掉捏合放大），
         而 standalone 的 PWA 仍然听。这一屏是拿着手机一只手点的记账板，
         捏合放大和双击放大只会把版式推歪，没人真想放大它。
         输入框一律 ≥16px 那条留着：那是另一件事（聚焦时的自动放大），也更好读 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- **跟顶栏/底栏同色，不是主题藏青。** iOS Safari 拿 theme-color 去填
         「页面内容之外」那块区域 —— 键盘弹起时那块被撑得很大，填藏青的话
         底栏下面就是一整片深蓝，看着像页面破了个洞。深色模式下换成深色那一档
         （下面那段脚本、以及 src/colorScheme.ts） -->
    <meta name="theme-color" content="#f9f9fb" />
    <!-- **首帧之前就定深浅色。** 等 JS 包下载完再切的话，深色用户每次打开
         都先白一下再黑。规则和 src/colorScheme.ts 是同一条（同一个键）：
         钉了就照钉的，没钉就跟系统 -->
    <script>
      // 主题色也在首帧之前挂上（src/themeColor.ts 存的那几个变量），不然先闪一下藏青
      try {
        var tv = JSON.parse(localStorage.getItem('nagaya.themeVars') || 'null')
        if (tv) for (var k in tv) document.documentElement.style.setProperty(k, tv[k])
      } catch (e) {}
      try {
        var p = localStorage.getItem('nagaya.scheme')
        if (p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18191c')
        }
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="長屋" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <title>長屋 nagaya</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
