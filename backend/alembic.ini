# Alembic 配置，只给命令行用（alembic revision --autogenerate、alembic check，见 alembic/versions/README.md）。
# 开机升级走 app/migrate.py，它自己把连接递给 env.py；库的地址也不写在这儿，env.py 从 app.db 取（NAGAYA_DB）

[alembic]
script_location = %(here)s/alembic

# 命令行的日志。开机升级时 env.py 不读这段（fileConfig 会把 uvicorn 的日志停掉）
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
